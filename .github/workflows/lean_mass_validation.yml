name: Lean Mass Report Validation

# One-time validation workflow; retry after aligning calorie/protein guidance.
on:
  push:
    paths:
      - ".github/workflows/lean_mass_validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install weekly dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weekly_requirements.txt

      - name: Compile changed scripts
        run: python -m py_compile scripts/73_adaptive_calorie_recommendation.py scripts/74_lean_mass_preservation.py scripts/80_weekly_coaching_report.py scripts/100_run_weekly_coaching_stack.py scripts/81_build_weekly_coaching_packet.py scripts/111_build_coaching_summary.py

      - name: Refresh live sources
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/05_refresh_current_sources.py

      - name: Rebuild analytics and reports
        run: python scripts/100_run_weekly_coaching_stack.py

      - name: Validate freshness
        run: python scripts/95_validate_data_freshness.py

      - name: Build email summary
        run: python scripts/111_build_coaching_summary.py

      - name: Verify lean-mass section
        run: |
          grep -q "Lean-Mass Preservation" reports/lean_mass_preservation.txt
          grep -q "Lean-Mass Preservation" reports/weekly_coaching_packet.txt
          grep -q "Lean-Mass Preservation" reports/weekly_coaching_summary.txt
          grep -q "Use the lean-mass preservation section" reports/adaptive_calorie_recommendation.txt
          if grep -q "Do not change protein" reports/adaptive_calorie_recommendation.txt; then exit 1; fi
          cat reports/lean_mass_preservation.txt
