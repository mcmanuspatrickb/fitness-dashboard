name: Weekly Coaching Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install weekly dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weekly_requirements.txt

      - name: Refresh current source data
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python scripts/05_refresh_current_sources.py

      - name: Rebuild coaching analytics
        run: |
          python scripts/100_run_weekly_coaching_stack.py

      - name: Validate data freshness
        if: always()
        run: |
          python scripts/95_validate_data_freshness.py

      - name: Persist adaptive coaching history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coaching_state/adaptive_coaching_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update adaptive coaching feedback history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No coaching history changes to persist."
          fi

      - name: Build email summary
        if: always()
        run: |
          python scripts/111_build_coaching_summary.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-reports
          path: reports/
          if-no-files-found: warn

      - name: Email weekly report
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python <<'EOF'
          import json
          import mimetypes
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          reports_dir = Path("reports")
          freshness_path = reports_dir / "data_freshness.json"
          status = "unknown"
          if freshness_path.exists():
              try:
                  status = json.loads(freshness_path.read_text(encoding="utf-8")).get(
                      "overall_status", "unknown"
                  )
              except Exception:
                  pass

          summary_txt = reports_dir / "weekly_coaching_summary.txt"
          summary_html = reports_dir / "weekly_coaching_summary.html"

          text_body = (
              summary_txt.read_text(encoding="utf-8")
              if summary_txt.exists()
              else "The weekly workflow ran, but the summary file was not generated. Check the attached diagnostics."
          )
          html_body = (
              summary_html.read_text(encoding="utf-8")
              if summary_html.exists()
              else "<html><body><h2>Weekly Coaching Report</h2><p>The summary file was not generated. Check the attached diagnostics.</p></body></html>"
          )

          # Incomplete-data emails contain only source/freshness diagnostics.
          # The full coaching packet is attached only after every core source
          # passes freshness checks, so missing data cannot be interpreted as
          # low protein, poor recovery, or missed training.
          attachment_names = [
              "data_freshness.txt",
              "source_refresh_status.txt",
          ]
          if status == "fresh":
              attachment_names.insert(0, "weekly_coaching_packet.txt")

          attachments = [
              reports_dir / name
              for name in attachment_names
              if (reports_dir / name).exists()
          ]

          msg = EmailMessage()
          msg["Subject"] = f"Weekly Coaching Report — {status.upper()}"
          msg["From"] = os.environ["EMAIL_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(text_body)
          msg.add_alternative(html_body, subtype="html")

          for file_path in attachments:
              mime_type, _ = mimetypes.guess_type(file_path.name)
              if mime_type:
                  maintype, subtype = mime_type.split("/", 1)
              else:
                  maintype, subtype = "application", "octet-stream"
              msg.add_attachment(
                  file_path.read_bytes(),
                  maintype=maintype,
                  subtype=subtype,
                  filename=file_path.name,
              )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(os.environ["EMAIL_USER"], os.environ["EMAIL_PASSWORD"])
              smtp.send_message(msg)

          print(f"Email sent. Data status: {status}. Attachments: {len(attachments)}")
          EOF
