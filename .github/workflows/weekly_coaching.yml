name: Weekly Coaching Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Run coaching pipeline
        env:
          CRONOMETER_EMAIL: ${{ secrets.CRONOMETER_EMAIL }}
          CRONOMETER_PASSWORD: ${{ secrets.CRONOMETER_PASSWORD }}
        run: |
          python scripts/100_run_weekly_coaching_stack.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-reports
          path: reports/
          if-no-files-found: warn

      - name: Email reports
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python <<'EOF'
          import os
          import smtplib
          import mimetypes
          from email.message import EmailMessage
          from pathlib import Path
          from html import escape

          email_user = os.environ["EMAIL_USER"]
          email_password = os.environ["EMAIL_PASSWORD"]
          email_to = os.environ["EMAIL_TO"]

          reports_dir = Path("reports")
          attachments = []

          if reports_dir.exists():
              attachments = sorted([p for p in reports_dir.rglob("*") if p.is_file()])

          msg = EmailMessage()
          msg["Subject"] = "Weekly Coaching Report"
          msg["From"] = email_user
          msg["To"] = email_to

          if attachments:
              file_list_text = "\n".join(f"- {p.name}" for p in attachments)
              file_list_html = "".join(f"<li>{escape(p.name)}</li>" for p in attachments)

              text_body = (
                  "Your weekly coaching report is ready.\n\n"
                  "Attached files:\n"
                  f"{file_list_text}\n\n"
                  "This email was sent automatically by your GitHub Actions workflow.\n"
              )

              html_body = (
                  "<!DOCTYPE html>"
                  "<html>"
                  "<body style='font-family: Arial, sans-serif; line-height: 1.5; color: #222;'>"
                  "<h2 style='margin-bottom: 0.4em;'>Weekly Coaching Report</h2>"
                  "<p>Your weekly coaching report is ready.</p>"
                  "<p><strong>Attached files:</strong></p>"
                  f"<ul>{file_list_html}</ul>"
                  "<p style='margin-top: 1.5em; color: #666; font-size: 0.95em;'>"
                  "This email was sent automatically by your GitHub Actions workflow."
                  "</p>"
                  "</body>"
                  "</html>"
              )

              msg.set_content(text_body)
              msg.add_alternative(html_body, subtype="html")

              for file_path in attachments:
                  mime_type, _ = mimetypes.guess_type(file_path.name)
                  if mime_type:
                      maintype, subtype = mime_type.split("/", 1)
                  else:
                      maintype, subtype = "application", "octet-stream"

                  with open(file_path, "rb") as f:
                      msg.add_attachment(
                          f.read(),
                          maintype=maintype,
                          subtype=subtype,
                          filename=file_path.name
                      )
          else:
              text_body = (
                  "The workflow ran, but no report files were found in the reports directory.\n\n"
                  "Please check the GitHub Actions logs and artifacts.\n"
              )

              html_body = (
                  "<!DOCTYPE html>"
                  "<html>"
                  "<body style='font-family: Arial, sans-serif; line-height: 1.5; color: #222;'>"
                  "<h2 style='margin-bottom: 0.4em;'>Weekly Coaching Report</h2>"
                  "<p>The workflow ran, but no report files were found in the "
                  "<code>reports/</code> directory.</p>"
                  "<p>Please check the GitHub Actions logs and artifacts.</p>"
                  "</body>"
                  "</html>"
              )

              msg.set_content(text_body)
              msg.add_alternative(html_body, subtype="html")

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(email_user, email_password)
              smtp.send_message(msg)

          print(f"Email sent. Attachments: {len(attachments)}")
          EOF
