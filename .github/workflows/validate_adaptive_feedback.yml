name: Validate Adaptive Coaching Feedback

on:
  push:
    paths:
      - ".github/workflows/validate_adaptive_feedback.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r weekly_requirements.txt
      - run: python -m py_compile scripts/73_adaptive_calorie_recommendation.py scripts/76_adaptive_coaching_feedback.py scripts/81_build_weekly_coaching_packet.py scripts/100_run_weekly_coaching_stack.py
      - name: Refresh live sources
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/05_refresh_current_sources.py
      - run: python scripts/100_run_weekly_coaching_stack.py
      - run: python scripts/95_validate_data_freshness.py
      - run: |
          cat reports/adaptive_coaching_feedback.txt
          echo "--- history ---"
          cat coaching_state/adaptive_coaching_history.csv
          echo "--- recommendation ---"
          sed -n '/Adaptive Feedback/,/Method Note/p' reports/adaptive_calorie_recommendation.txt
