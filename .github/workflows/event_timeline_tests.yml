name: Event Timeline Tests

on:
  push:
    branches:
      - feature/fasting-exercise-timeline
    paths:
      - scripts/19_sync_exercise_timeline.py
      - scripts/20_sync_cronometer_fasts.py
      - tests/test_manual_event_timeline.py
      - .github/workflows/event_timeline_tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install requests==2.32.5
      - name: Fictional-only parser tests
        run: python -m unittest discover -s tests -p test_manual_event_timeline.py -v
