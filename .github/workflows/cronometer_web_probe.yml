name: Cronometer WEB Fasting Read-only Probe

on:
  push:
    branches:
      - feature/cronometer-web-fasting-probe
    paths:
      - .github/workflows/cronometer_web_probe.yml
      - scripts/21_probe_cronometer_web_fasts.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned upstream reader
        run: |
          pip install --disable-pip-version-check "git+https://github.com/cphoskins/cronometer-mcp.git@0f11757011f8e9a94e5ae3572cfe7cdeff419d7d"
      - name: Read-only web fasting history probe
        env:
          CRONOMETER_USERNAME: ${{ secrets.CRONOMETER_USERNAME || secrets.CRONOMETER_EMAIL }}
          CRONOMETER_PASSWORD: ${{ secrets.CRONOMETER_PASSWORD }}
          CRONOMETER_READ_ONLY: "1"
          CRONOMETER_DATA_DIR: ${{ runner.temp }}/cronometer
        run: python scripts/21_probe_cronometer_web_fasts.py
