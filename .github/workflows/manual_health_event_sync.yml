name: Manual Health Event Timeline Refresh
# One-time isolated integration retry: Google Health continues if Hevy credential is rejected.

on:
  push:
    branches: [feature/fasting-exercise-timeline]
    paths: [.github/workflows/manual_health_event_sync.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-event-timeline-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: pip install -r weekly_requirements.txt
      - name: Refresh Hevy and Google Health exercise sessions to private Neon
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
        run: python scripts/19_sync_exercise_timeline.py --days 60
