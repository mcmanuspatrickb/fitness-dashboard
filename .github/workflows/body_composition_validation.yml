name: Body Composition Validation

on:
  push:
    paths:
      - ".github/workflows/body_composition_validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install weekly dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weekly_requirements.txt

      - name: Compile changed scripts
        run: |
          python -m py_compile scripts/12_sync_withings_persistent.py scripts/95_validate_data_freshness.py

      - name: Refresh live sources
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/05_refresh_current_sources.py

      - name: Rebuild analytics
        run: python scripts/100_run_weekly_coaching_stack.py

      - name: Validate freshness
        run: python scripts/95_validate_data_freshness.py

      - name: Inspect current body composition
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect('db/fitness.duckdb', read_only=True)
          print(con.execute('''
              SELECT date, weight_kg, body_fat_percent, fat_mass_kg, lean_mass_kg,
                     muscle_mass_kg, muscle_percent, body_water_percent, visceral_fat
              FROM clean.body_composition
              ORDER BY date DESC
              LIMIT 10
          ''').fetchdf().to_string(index=False))
          con.close()
          PY
          echo "--- freshness ---"
          cat reports/data_freshness.txt
