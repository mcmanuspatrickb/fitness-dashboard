name: Refine Personal Response Analysis

on:
  push:
    paths:
      - ".github/workflows/refine_personal_response.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Refine analysis cohort
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("scripts/75_personal_response_analysis.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "MIN_BLOCKS_FOR_ASSOCIATION = 8\n",
              "MIN_BLOCKS_FOR_ASSOCIATION = 8\nMIN_WORKOUTS_FOR_TRAINING_ACTIVE = 2\n",
              1,
          )

          old = '''        compatible = usable[
                      (usable["fat_change_kg"] < 0)
                      & (usable["lean_change_kg"] >= -0.30)
                  ].copy()

                  lines.extend(
          '''
          new = '''        compatible = usable[
                      (usable["fat_change_kg"] < 0)
                      & (usable["lean_change_kg"] >= -0.30)
                  ].copy()
                  training_active = blocks[
                      pd.to_numeric(blocks["workouts"], errors="coerce").fillna(0)
                      >= MIN_WORKOUTS_FOR_TRAINING_ACTIVE
                  ].copy()
                  active_usable = training_active.dropna(
                      subset=["fat_change_kg", "lean_change_kg"]
                  ).copy()
                  active_compatible = active_usable[
                      (active_usable["fat_change_kg"] < 0)
                      & (active_usable["lean_change_kg"] >= -0.30)
                  ].copy()

                  lines.extend(
          '''
          if old not in text:
              raise SystemExit("cohort block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '                f"Blocks with fat down and BIA lean change >= -0.30 kg: {len(compatible)}",\n',
              '                f"Blocks with fat down and BIA lean change >= -0.30 kg: {len(compatible)}",\n'
              '                f"Training-active blocks (>= {MIN_WORKOUTS_FOR_TRAINING_ACTIVE} resistance workouts / 14d): {len(training_active)}",\n'
              '                f"Training-active blocks compatible with the current goal: {len(active_compatible)}",\n',
              1,
          )

          text = text.replace(
              '                "Typical qualifying block",\n                "------------------------",\n',
              '                "All qualifying historical blocks",\n                "--------------------------------",\n',
              1,
          )

          marker = '''        if not compatible.empty:
                      lines.extend(
                          [
                              "",
                              "Periods compatible with the current goal",
                              "----------------------------------------",
                              "These periods had declining BIA fat mass while BIA lean change was no worse than -0.30 kg across the 14-day trend window.",
                              f"Median calories: {_fmt(compatible['avg_calories'].median(), 0)} kcal/day",
                              f"Median protein: {_fmt(compatible['avg_protein_g'].median(), 0)} g/day",
                              f"Median steps: {_fmt(compatible['avg_steps'].median(), 0)} /day",
                              f"Median sleep: {_fmt(compatible['avg_sleep_h'].median(), 1)} h/night",
                              f"Median workouts: {_fmt(compatible['workouts'].median(), 0)} per 14 days",
                          ]
                      )

          '''
          replacement = marker + '''        if not training_active.empty:
                      lines.extend(
                          [
                              "",
                              "Training-active periods",
                              "-----------------------",
                              "This is the more relevant cohort for a muscle-preservation goal because periods with little or no resistance training are excluded.",
                              f"Median calories: {_fmt(training_active['avg_calories'].median(), 0)} kcal/day",
                              f"Median protein: {_fmt(training_active['avg_protein_g'].median(), 0)} g/day",
                              f"Median steps: {_fmt(training_active['avg_steps'].median(), 0)} /day",
                              f"Median sleep: {_fmt(training_active['avg_sleep_h'].median(), 1)} h/night",
                              f"Median workouts: {_fmt(training_active['workouts'].median(), 0)} per 14 days",
                          ]
                      )
                      if not active_compatible.empty:
                          lines.extend(
                              [
                                  "",
                                  "Training-active periods compatible with the goal",
                                  "------------------------------------------------",
                                  f"Median calories: {_fmt(active_compatible['avg_calories'].median(), 0)} kcal/day",
                                  f"Median protein: {_fmt(active_compatible['avg_protein_g'].median(), 0)} g/day",
                                  f"Median steps: {_fmt(active_compatible['avg_steps'].median(), 0)} /day",
                                  f"Median sleep: {_fmt(active_compatible['avg_sleep_h'].median(), 1)} h/night",
                                  f"Median workouts: {_fmt(active_compatible['workouts'].median(), 0)} per 14 days",
                              ]
                          )

          '''
          if marker not in text:
              raise SystemExit("compatible section marker not found")
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              '                "Positive fat-loss correlation means higher values tended to accompany more BIA fat loss; positive lean-retention correlation means higher values tended to accompany better BIA lean retention.",\n',
              '                f"Associations below use only training-active periods (>= {MIN_WORKOUTS_FOR_TRAINING_ACTIVE} resistance workouts / 14d). Positive fat-loss correlation means higher values tended to accompany more BIA fat loss; positive lean-retention correlation means higher values tended to accompany better BIA lean retention.",\n',
              1,
          )
          text = text.replace(
              '_spearman(blocks, column, "fat_loss_kg")',
              '_spearman(training_active, column, "fat_loss_kg")',
          )
          text = text.replace(
              '_spearman(blocks, column, "lean_retention_kg")',
              '_spearman(training_active, column, "lean_retention_kg")',
          )

          text = text.replace(
              '            f"Associations are reported only with at least {MIN_BLOCKS_FOR_ASSOCIATION} comparable blocks and use Spearman rank correlation. They should be treated as hypotheses to test, not prescriptions.",\n',
              '            f"Associations are reported only with at least {MIN_BLOCKS_FOR_ASSOCIATION} training-active comparable blocks and use Spearman rank correlation. They should be treated as hypotheses to test, not prescriptions.",\n',
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile
        run: python -m py_compile scripts/75_personal_response_analysis.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/75_personal_response_analysis.py
          git commit -m "Focus personal response analysis on training-active periods"
          git push
