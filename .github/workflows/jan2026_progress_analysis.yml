name: 2026 Progress Analysis

on:
  push:
    paths:
      - ".github/workflows/jan2026_progress_analysis.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r weekly_requirements.txt
      - name: Refresh current sources
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/05_refresh_current_sources.py
      - name: Run coaching stack
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
        run: python scripts/100_run_weekly_coaching_stack.py
      - name: Analyze January-to-present progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import duckdb
          import pandas as pd
          import numpy as np

          db = Path('db/fitness.duckdb')
          con = duckdb.connect(str(db), read_only=True)
          START = pd.Timestamp('2026-01-01')
          CUT_START = pd.Timestamp('2026-01-08')
          END = pd.Timestamp('2026-09-18')

          body = con.execute("""
              SELECT date, weight_kg, fat_mass_kg, lean_mass_kg,
                     CASE WHEN weight_kg > 0 THEN fat_mass_kg / weight_kg * 100 END AS body_fat_pct
              FROM clean.body_composition
              WHERE date BETWEEN '2026-01-01' AND '2026-09-18'
              ORDER BY date
          """).fetchdf()
          nutrition = con.execute("""
              SELECT date, calories, protein_g, carbs_g, fat_g
              FROM clean.nutrition_daily
              WHERE date BETWEEN '2026-01-01' AND '2026-09-18'
              ORDER BY date
          """).fetchdf()
          activity = con.execute("""
              SELECT date, steps, sleep_hours, resting_hr, hrv
              FROM clean.activity_recovery_daily
              WHERE date BETWEEN '2026-01-01' AND '2026-09-18'
              ORDER BY date
          """).fetchdf()
          training = con.execute("""
              SELECT date, workout_count, total_volume
              FROM clean.training_summary
              WHERE date BETWEEN '2026-01-01' AND '2026-09-18'
              ORDER BY date
          """).fetchdf()
          waist = con.execute("""
              SELECT date, waist_cm
              FROM clean.performance_markers_daily
              WHERE date BETWEEN '2026-01-01' AND '2026-09-18' AND waist_cm IS NOT NULL
              ORDER BY date
          """).fetchdf()
          con.close()

          for df in [body, nutrition, activity, training, waist]:
              if not df.empty:
                  df['date'] = pd.to_datetime(df['date'])

          def mean_between(df, start, end, col):
              vals = pd.to_numeric(df.loc[df['date'].between(start, end), col], errors='coerce').dropna()
              return float(vals.mean()) if len(vals) else np.nan

          def first_on_or_after(df, dt):
              x = df[df['date'] >= dt].sort_values('date')
              return None if x.empty else x.iloc[0]

          def last_on_or_before(df, dt):
              x = df[df['date'] <= dt].sort_values('date')
              return None if x.empty else x.iloc[-1]

          start_row = first_on_or_after(body, CUT_START)
          end_row = last_on_or_before(body, END)
          start7 = body[body['date'].between(CUT_START, CUT_START + pd.Timedelta(days=6))]
          end7 = body[body['date'].between(END - pd.Timedelta(days=6), END)]

          print('\n=== OVERALL BODY-COMPOSITION PROGRESS ===')
          if start_row is not None:
              print(f"Start anchor: {start_row['date'].date()} | weight={start_row['weight_kg']:.3f} kg | fat={start_row['fat_mass_kg']:.3f} kg | lean={start_row['lean_mass_kg']:.3f} kg | BF={start_row['body_fat_pct']:.2f}%")
          if end_row is not None:
              print(f"End anchor: {end_row['date'].date()} | weight={end_row['weight_kg']:.3f} kg | fat={end_row['fat_mass_kg']:.3f} kg | lean={end_row['lean_mass_kg']:.3f} kg | BF={end_row['body_fat_pct']:.2f}%")
          if start_row is not None and end_row is not None:
              print(f"Exact-anchor change: weight={end_row['weight_kg']-start_row['weight_kg']:+.3f} kg | fat={end_row['fat_mass_kg']-start_row['fat_mass_kg']:+.3f} kg | lean={end_row['lean_mass_kg']-start_row['lean_mass_kg']:+.3f} kg | BF={end_row['body_fat_pct']-start_row['body_fat_pct']:+.2f} pp")
              days=(end_row['date']-start_row['date']).days
              pct=(end_row['weight_kg']/start_row['weight_kg']-1)*100
              print(f"Elapsed={days} days | total body-weight change={pct:.2f}% | average={-(end_row['weight_kg']-start_row['weight_kg'])/(days/7):.3f} kg/week lost")
          if not start7.empty and not end7.empty:
              cols=['weight_kg','fat_mass_kg','lean_mass_kg','body_fat_pct']
              s=start7[cols].mean(numeric_only=True); e=end7[cols].mean(numeric_only=True)
              print(f"7d-smoothed start ({start7['date'].min().date()} to {start7['date'].max().date()}): weight={s.weight_kg:.3f}, fat={s.fat_mass_kg:.3f}, lean={s.lean_mass_kg:.3f}, BF={s.body_fat_pct:.2f}%")
              print(f"7d-smoothed end ({end7['date'].min().date()} to {end7['date'].max().date()}): weight={e.weight_kg:.3f}, fat={e.fat_mass_kg:.3f}, lean={e.lean_mass_kg:.3f}, BF={e.body_fat_pct:.2f}%")
              print(f"7d-smoothed change: weight={e.weight_kg-s.weight_kg:+.3f}, fat={e.fat_mass_kg-s.fat_mass_kg:+.3f}, lean={e.lean_mass_kg-s.lean_mass_kg:+.3f}, BF={e.body_fat_pct-s.body_fat_pct:+.2f} pp")

          print('\n=== MONTHLY BODY COMPOSITION ===')
          b=body.copy(); b['month']=b['date'].dt.to_period('M').astype(str)
          print(b.groupby('month').agg(days=('weight_kg','count'), weight=('weight_kg','mean'), fat=('fat_mass_kg','mean'), lean=('lean_mass_kg','mean'), bf=('body_fat_pct','mean')).round(2).to_string())

          print('\n=== MONTHLY NUTRITION ===')
          n=nutrition.copy(); n['month']=n['date'].dt.to_period('M').astype(str)
          print(n.groupby('month').agg(days=('calories','count'), calories=('calories','mean'), protein=('protein_g','mean'), carbs=('carbs_g','mean'), fat=('fat_g','mean')).round(1).to_string())

          print('\n=== MONTHLY ACTIVITY / RECOVERY ===')
          a=activity.copy(); a['month']=a['date'].dt.to_period('M').astype(str)
          print(a.groupby('month').agg(step_days=('steps','count'), steps=('steps','mean'), sleep_days=('sleep_hours','count'), sleep=('sleep_hours','mean'), rhr=('resting_hr','mean'), hrv=('hrv','mean')).round(2).to_string())

          print('\n=== MONTHLY RESISTANCE TRAINING ===')
          t=training.copy(); t['month']=t['date'].dt.to_period('M').astype(str)
          monthly=t.groupby('month').agg(workouts=('workout_count','sum'), volume=('total_volume','sum')).reset_index()
          for _,r in monthly.iterrows():
              period=pd.Period(r['month'],freq='M'); days_in_month=period.days_in_month
              start=max(pd.Timestamp(period.start_time.date()), START); end=min(pd.Timestamp(period.end_time.date()), END)
              days=max((end-start).days+1,1)
              print(f"{r['month']}: workouts={int(r.workouts)} | sessions/week={r.workouts/(days/7):.2f} | total_volume={r.volume:.0f}")
          total_workouts = pd.to_numeric(training['workout_count'], errors='coerce').fillna(0).sum()
          total_days=(END-START).days+1
          print(f"2026 total through {END.date()}: {int(total_workouts)} workouts | {total_workouts/(total_days/7):.2f} sessions/week average")

          print('\n=== WAIST ===')
          if waist.empty:
              print('No waist data in 2026')
          else:
              print(waist.to_string(index=False))
              if len(waist)>=2:
                  print(f"Waist change: {waist.iloc[-1].waist_cm-waist.iloc[0].waist_cm:+.1f} cm ({waist.iloc[0].date.date()} to {waist.iloc[-1].date.date()})")

          print('\n=== STRENGTH PROGRESSION ===')
          detail_path=Path('reports/strength_progress_detail.csv')
          if detail_path.exists():
              d=pd.read_csv(detail_path, parse_dates=['date'])
              d=d[d['date'].between(START, END)].copy()
              for lift in sorted(d['target_lift'].dropna().unique()):
                  sub=d[d['target_lift']==lift].sort_values('date')
                  first=sub.iloc[0]; last=sub.iloc[-1]; best=sub.loc[sub['estimated_1rm'].idxmax()]
                  print(f"{lift}: first {first.estimated_1rm:.1f} e1RM on {first.date.date()} ({first.weight_kg:.1f}x{int(first.reps)}); latest {last.estimated_1rm:.1f} on {last.date.date()} ({last.weight_kg:.1f}x{int(last.reps)}); best {best.estimated_1rm:.1f} on {best.date.date()} | first→latest {last.estimated_1rm-first.estimated_1rm:+.1f}")
          else:
              print('No strength detail report found')

          print('\n=== PHASED WEIGHT LOSS ===')
          # monthly first/last means to show faster/slower phases
          for month, sub in b.groupby('month'):
              sub=sub.sort_values('date')
              if len(sub)>=2:
                  first_mean=sub.head(min(5,len(sub)))['weight_kg'].mean(); last_mean=sub.tail(min(5,len(sub)))['weight_kg'].mean()
                  print(f"{month}: approx weight change {last_mean-first_mean:+.2f} kg (first/last up to 5 weigh-ins)")

          print('\n=== DATA COVERAGE SINCE JAN 8 ===')
          rng_start=CUT_START
          print(f"Body days: {body[body.date>=rng_start].weight_kg.notna().sum()}")
          print(f"Nutrition days: {nutrition[nutrition.date>=rng_start].calories.notna().sum()}")
          print(f"Step days: {activity[activity.date>=rng_start].steps.notna().sum()}")
          print(f"Sleep days: {activity[activity.date>=rng_start].sleep_hours.notna().sum()}")
          print(f"Training days: {training[training.date>=rng_start].workout_count.notna().sum()}")
          PY