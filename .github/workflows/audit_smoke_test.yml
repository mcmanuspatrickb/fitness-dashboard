name: Audit Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install weekly dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weekly_requirements.txt

      - name: Compile modernized scripts
        run: |
          python -m py_compile \
            scripts/05_refresh_current_sources.py \
            scripts/12_sync_withings_persistent.py \
            scripts/15_ingest_hevy_current.py \
            scripts/18_ingest_google_health.py \
            scripts/22_build_clean_fitbit_daily.py \
            scripts/24_build_clean_nutrition_daily.py \
            scripts/95_validate_data_freshness.py \
            scripts/100_run_weekly_coaching_stack.py \
            scripts/111_build_coaching_summary.py

      - name: Rebuild analytics from committed seed database
        run: |
          python scripts/100_run_weekly_coaching_stack.py

      - name: Validate freshness and build summary
        if: always()
        run: |
          python scripts/95_validate_data_freshness.py
          python scripts/111_build_coaching_summary.py
